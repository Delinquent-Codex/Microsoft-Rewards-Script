name: Code Quality

on:
    push:
        branches: ['v4']
    pull_request:
        branches: ['v4']
    workflow_dispatch:

concurrency:
    group: code-quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: Build, lint, test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: TypeScript build
              run: npm run build

            - name: ESLint
              run: npm run lint

            - name: Log parser tests
              run: npm run test:log-parser
