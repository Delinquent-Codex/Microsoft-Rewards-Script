name: Code Quality

on:
    push:
        branches: ['v4']
    pull_request:
        branches: ['v4']
    workflow_dispatch:

concurrency:
    group: code-quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    verify:
        name: Apply bootstrap fixes, build, lint, test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Set up Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Apply Rewards bootstrap and failure-exit fixes
              shell: bash
              run: |
                  python3 <<'PY'
                  from pathlib import Path

                  def replace_once(path: str, old: str, new: str) -> None:
                      file = Path(path)
                      text = file.read_text()
                      count = text.count(old)
                      if count != 1:
                          raise SystemExit(f'{path}: expected exactly one target, found {count}')
                      file.write_text(text.replace(old, new, 1))

                  browser_func = 'src/browser/BrowserFunc.ts'
                  replace_once(
                      browser_func,
                      """        } catch (error) {
                              throw this.bot.logger.error(
                                  this.bot.isMobile,
                                  'GET-DASHBOARD-DATA',
                                  `Failed to get dashboard data: ${error instanceof Error ? error.message : String(error)}`
                              )
                          }
                  """,
                      """        } catch (error) {
                              this.bot.logger.error(
                                  this.bot.isMobile,
                                  'GET-DASHBOARD-DATA',
                                  `Failed to get dashboard data: ${error instanceof Error ? error.message : String(error)}`
                              )
                              throw error instanceof Error ? error : new Error(String(error))
                          }
                  """
                  )

                  replace_once(
                      browser_func,
                      """            // /earn is the offers page
                              await page.goto(URLs.rewards.earn, { waitUntil: 'domcontentloaded' })

                              const earnDom = await page.content()
                              const earnRaw = await this.fetchBootstrapHtml(page, URLs.rewards.earn, '/earn')
                  """,
                      """            // /earn is the offers page
                              await page.goto(URLs.rewards.earn, { waitUntil: 'domcontentloaded' })

                              const earnDom = await this.capturePageContent(page, '/earn')
                              const earnRaw = await this.fetchBootstrapHtml(page, URLs.rewards.earn, '/earn')
                  """
                  )

                  replace_once(
                      browser_func,
                      """    private async fetchBootstrapHtml(page: Page, url: string, route: string): Promise<string> {
                  """,
                      """    private async capturePageContent(page: Page, route: string, maxAttempts = 4): Promise<string> {
                          let lastError: unknown

                          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                              try {
                                  await page.waitForLoadState('domcontentloaded', { timeout: 5000 }).catch(() => {})
                                  await this.bot.utils.wait(300)
                                  return await page.content()
                              } catch (error) {
                                  lastError = error

                                  if (page.isClosed() || isBrowserClosedError(error)) {
                                      throw error
                                  }

                                  if (attempt < maxAttempts) {
                                      this.bot.logger.warn(
                                          this.bot.isMobile,
                                          'BOOTSTRAP',
                                          `Rewards page still navigating; retrying content capture ${attempt}/${maxAttempts} | route=${route}`
                                      )
                                      await this.bot.utils.wait(500 * attempt)
                                  }
                              }
                          }

                          this.bot.logger.warn(
                              this.bot.isMobile,
                              'BOOTSTRAP',
                              `Rewards DOM capture unavailable after ${maxAttempts} attempts | route=${route} | error=${lastError instanceof Error ? lastError.message : String(lastError)} | continuing with direct HTML fetch`
                          )
                          return ''
                      }

                      private async fetchBootstrapHtml(page: Page, url: string, route: string): Promise<string> {
                  """
                  )

                  replace_once(
                      'src/browser/auth/Login.ts',
                      """        } catch (error) {
                              throw this.bot.logger.error(
                                  this.bot.isMobile,
                                  'GET-REWARD-SESSION',
                                  `Failed to acquire rewards context: ${error instanceof Error ? error.message : String(error)}`
                              )
                          }
                  """,
                      """        } catch (error) {
                              this.bot.logger.error(
                                  this.bot.isMobile,
                                  'GET-REWARD-SESSION',
                                  `Failed to acquire rewards context: ${error instanceof Error ? error.message : String(error)}`
                              )
                              throw error instanceof Error ? error : new Error(String(error))
                          }
                  """
                  )

                  index_file = 'src/index.ts'
                  replace_once(
                      index_file,
                      """                const stats = await this.runTasks(chunk, runStartTime ?? runStartTimeFromMaster ?? Date.now())

                                      if (process.send) {
                                          process.send({ __stats: stats })
                                      }

                                      await flushAllWebhooks()
                                      process.exit(0)
                  """,
                      """                const stats = await this.runTasks(chunk, runStartTime ?? runStartTimeFromMaster ?? Date.now())
                                      const hadAccountFailure = stats.some(stat => !stat.success)

                                      if (process.send) {
                                          process.send({ __stats: stats })
                                      }

                                      await flushAllWebhooks()
                                      process.exit(hadAccountFailure ? 1 : 0)
                  """
                  )

                  replace_once(
                      index_file,
                      """            await flushAllWebhooks()
                              process.exit(0)
                          }

                          return accountStats
                  """,
                      """            await flushAllWebhooks()
                              process.exit(accountStats.some(stat => !stat.success) ? 1 : 0)
                          }

                          return accountStats
                  """
                  )
                  PY

                  # Restore the normal quality workflow in the same source-fix commit.
                  git show HEAD^:.github/workflows/code-quality.yml > .github/workflows/code-quality.yml

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Format source
              run: npm run format

            - name: TypeScript build
              run: npm run build

            - name: ESLint
              run: npm run lint

            - name: Log parser tests
              run: npm run test:log-parser

            - name: Commit verified fixes
              shell: bash
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -A
                  if git diff --cached --quiet; then
                    echo 'No patch changes to commit.'
                    exit 0
                  fi
                  git commit -m 'Fix Rewards bootstrap navigation races and failure exits'
                  git push origin HEAD:v4
